[package]
name = "validator"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.42"
clap = "4.5.20"
env_logger = "0.11.5"
futures = "0.3.31"
log = "0.4.28"
postgrest = "1.6.0"
rand = "0.10.0"
serde = { version = "1.0.104", features = ["derive"] }
serde_json = "1.0.128"
simploxide-client = { version = "0.7.0", features = ["bon"] }
tokio = { version = "1.51.1", features = ["full"] }
uuid = { version = "1.19.0", features = ["v4"] }
